name: Build iOS IPA

on:
  push:
    branches: [ master-old, main ]
  pull_request:
    branches: [ master-old, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja
          echo "Xcode version: $(xcodebuild -version)"

      - name: Configure CMake for iOS
        run: |
          rm -rf build
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPCSX2_TARGET_IOS=ON \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.toolchain.cmake \
            -DIOS=ON \
            2>&1 | tee cmake_full.txt
          echo "Exit code: $?"
          cat cmake_full.txt

      - name: Upload cmake log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-full-log
          path: cmake_full.txt

      - name: Build PCSX2
        run: |
          set -o pipefail
          cmake --build build --target PCSX2 -- -k 0 2>&1 | tee build_errors.txt
          echo "Build exit code: ${PIPESTATUS[0]}"

      - name: Extract unique errors
        run: |
          set -o pipefail
          grep -E "^FAILED:|error:" build_errors.txt | sort -u > unique_errors.txt
          echo "Unique errors found:"
          cat unique_errors.txt

      - name: Upload build errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build_errors.txt

      - name: Upload unique errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unique-errors
          path: unique_errors.txt

      - name: Find executable
        run: |
          find build/ -name "PCSX2" -o -name "*.app" 2>/dev/null | head -20
          echo "--- Checking for PCSX2 static libraries ---"
          find build/ -name "*.a" | grep -i pcsx2 | head -10
          echo "--- Checking for libPCSX2 files ---"
          find build/ -name "libPCSX2*" | head -10
          echo "--- Listing build/pcsx2/ contents ---"
          ls build/pcsx2/ 2>/dev/null | head -20
          echo "--- Checking build.ninja for PCSX2 references ---"
          cat build/build.ninja 2>/dev/null | grep -i "pcsx2" | head -10

      - name: Create unsigned IPA
        run: |
          set -e
          APP_DIR=Payload/BionicSX2.app
          mkdir -p ${APP_DIR}/Resources/cheats
          mkdir -p ${APP_DIR}/Resources/patches
          mkdir -p ${APP_DIR}/Resources/translations

          # Copy executable (must be at .app root)
          cp build/bin/PCSX2 ${APP_DIR}/BionicSX2

          # Copy Info.plist
          cp ios/Info.plist ${APP_DIR}/Info.plist

          # Copy Metal shaders to Resources/
          if [ -d "build/pcsx2/GS/Renderers/Metal" ]; then
            cp build/pcsx2/GS/Renderers/Metal/*.metal ${APP_DIR}/Resources/ 2>/dev/null || true
          fi

          # Copy PCSX2 resources (GameIndex, cheats, patches, etc.)
          if [ -d "bin/resources" ]; then
            cp -r bin/resources/* ${APP_DIR}/Resources/ 2>/dev/null || true
          fi

          # Copy entitlements
          mkdir -p ${APP_DIR}/Contents
          cp ios/entitlements/BionicSX2.entitlements ${APP_DIR}/Contents/

          # Set executable permission
          chmod +x ${APP_DIR}/BionicSX2

          # Sign with entitlements (ad-hoc, unsigned IPA for sideloading)
          codesign --force --sign - --entitlements ios/entitlements/BionicSX2.entitlements ${APP_DIR}/BionicSX2 || true

          # Create IPA (zip format)
          zip -r BionicSX2.ipa Payload
          echo "IPA created: BionicSX2.ipa"
          ls -la BionicSX2.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BionicSX2-IPA
          path: BionicSX2.ipa
          retention-days: 7
